<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TOBK DS">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>TOBK DS ULTIMATE</title>
  <style>
    html,body{margin:0;height:100%;background:#fff;font-family:sans-serif}
    iframe{border:0;width:100%;height:100%;display:block}
    #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
          background:#fff;color:#1a73e8;font-size:18px;transition:opacity .3s}
  </style>
</head>
<body>
  <div id="load">Memuat aplikasi...</div>
  <iframe id="app" allow="camera; microphone; geolocation; clipboard-write"></iframe>
  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbxVwjnDOpKg81PPmJyI1udRyAzNQRYL95nojPJ-U7jDa0EUJlofpt4pb-pX04QO-QkYhw/exec";
    var f = document.getElementById('app');
    f.onload = function () {
      var l = document.getElementById('load'); l.style.opacity = 0;
      setTimeout(function () { l.style.display = 'none'; }, 300);
    };
    f.src = APP_URL;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
